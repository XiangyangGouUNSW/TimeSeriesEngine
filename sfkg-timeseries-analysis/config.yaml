# P 端空壳配置

server:
  address: "0.0.0.0"        # P 端对外 gRPC 服务监听地址（供 S 端调用）
  port: 50053               # P 端对外 gRPC 服务端口

core:
  provider: "mock"          # mock = 本地 ETT 假装 C 端；grpc = 连真的 C 端
                            # 联调预演：python main.py --provider grpc
  address: "222.29.156.141"      # C 端 gRPC 地址
  port: 50052               # C 端 gRPC 端口（C 端默认监听 50051）
  timeout_seconds: 30.0     # 调 C 端超时

s:
  address: "localhost"      # S 端服务地址（S 和 P 同机，用 localhost）
  port: 9106                # S 端服务端口（analysis-receiver-port，S 敲定）
  timeout_seconds: 10.0     # 调 S 端超时

data:
  # mock 数据源：用 ETT 数据集模拟 C 端 TDengine 里的数据
  csv_path: "data/ETT-small/ETTh1.csv"   # 相对本模块目录（模块自包含）
  seq_prefix: "ETTh1"                    # sequence_id 前缀，例如 ETTh1_OT
  target_sequence: "ETTh1_OT"            # 预测目标（变压器油温）
  feature_sequences:
    - "ETTh1_HUFL"
    - "ETTh1_HULL"
    - "ETTh1_MUFL"
    - "ETTh1_MULL"
    - "ETTh1_LUFL"
    - "ETTh1_LULL"

training:
  min_train_points: 1000       # 数据规模门槛：点数达到就开始训练
  poll_interval_seconds: 3     # 轮询间隔（演示用短一点）
  max_poll_attempts: 5         # 最多轮询几次
  ar_order: 5                  # 自回归阶数 p
  train_ratio: 0.8             # 用前 80% 的数据训练

inference:
  window_size: 100             # 推理时取最近多少行当输入
  horizon_steps: 24            # 预测未来多少步
  pretend_today_ratio: 0.97    # 演示：假装"现在是"数据集的 97% 位置，
                               # 留最后 3% 当真实值，用来对比预测准不准
