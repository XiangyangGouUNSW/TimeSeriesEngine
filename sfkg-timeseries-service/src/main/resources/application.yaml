spring:
  application:
    name: timeseries-service

server:
  port: 8080

  # ── Explicit REST (Tomcat) capacity configuration ──────────────
  # These are Spring Boot native properties — 100% reliable.
  # Override via env: SERVER_TOMCAT_THREADS_MAX, etc.
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:200}              # 最大工作线程
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:10}   # 最小空闲线程
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:8192}   # 最大并发连接
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:100}          # 线程满时等待队列
    connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:30000}  # 连接超时(ms)

# ── Application config ──────────────────────────────────────────
timeseries:
  local-store-dir: ${TIMESERIES_LOCAL_STORE_DIR:data}
  local-data-file: ${TIMESERIES_LOCAL_DATA_FILE:data/timeseries-data.jsonl}
  grpc:
    server-port: ${TIMESERIES_GRPC_SERVER_PORT:9105}
    analysis-receiver-port: ${TIMESERIES_GRPC_ANALYSIS_RECEIVER_PORT:9106}
    core-address: ${TIMESERIES_CORE_GRPC_ADDRESS:222.29.156.141:50051}
    anomaly-address: ${TIMESERIES_ANOMALY_GRPC_ADDRESS:localhost:50053}
    forecast-address: ${TIMESERIES_FORECAST_GRPC_ADDRESS:localhost:50053}
    decision-address: ${TIMESERIES_DECISION_GRPC_ADDRESS:localhost:50053}

  # ── Ingest buffer-pool (hash-partitioned async pipeline) ─────────
  ingest:
    sender-threads: ${INGEST_SENDER_THREADS:4}               # Sender 线程数 (seq_id hash % N)
    batch-size: ${INGEST_BATCH_SIZE:1000}                     # 攒够多少点发送
    batch-timeout-ms: ${INGEST_BATCH_TIMEOUT_MS:500}         # 超时强制发送 (ms)
    queue-capacity: ${INGEST_QUEUE_CAPACITY:100000}           # 每线程队列上限
