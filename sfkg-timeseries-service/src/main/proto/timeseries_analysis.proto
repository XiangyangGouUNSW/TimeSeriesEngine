syntax = "proto3";

package sfkg.timeseries.analysis.v1;

option java_multiple_files = true;
option java_package = "com.sfkg.timeseries.grpc";

// ── Analysis service: Java → Python analysis engine ───────────────

service TimeseriesAnalysisService {
  rpc SyncAnomalyTask (AnalysisSyncAnomalyTaskRequest) returns (TaskAck);
  rpc SyncForecastTask (AnalysisSyncForecastTaskRequest) returns (TaskAck);
  rpc UpdateTaskStatus (AnalysisUpdateTaskStatusRequest) returns (TaskAck);
  rpc QueryAnomalyResults (QueryAnomalyResultsRequest) returns (QueryAnomalyResultsResponse);
  rpc QueryForecastResults (QueryForecastResultsRequest) returns (QueryForecastResultsResponse);
  rpc GenerateDiagnosis (AnalysisDecisionRequest) returns (AnalysisDecisionResult);
  rpc GenerateSuggestion (AnalysisDecisionRequest) returns (AnalysisDecisionResult);
}

// ── Analysis result receiver: Python → Java ───────────────────────

service AnalysisResultReceiverService {
  rpc ReceiveAnomalyResult (AnomalyResultMessage) returns (ResultAck);
}

// ── Enums ─────────────────────────────────────────────────────────

enum AnalysisStatus {
  ANALYSIS_STATUS_UNSPECIFIED = 0;
  ANALYSIS_STATUS_SUCCESS = 1;
  ANALYSIS_STATUS_INVALID_REQUEST = 2;
  ANALYSIS_STATUS_DATA_NOT_READY = 3;
  ANALYSIS_STATUS_MODEL_NOT_READY = 4;
  ANALYSIS_STATUS_UPSTREAM_UNAVAILABLE = 5;
  ANALYSIS_STATUS_NOT_IMPLEMENTED = 6;
  ANALYSIS_STATUS_FAILED = 7;
}

enum AnalysisTaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_ENABLED = 1;
  TASK_STATUS_DISABLED = 2;
  TASK_STATUS_DELETED = 3;
}

enum AnomalyEventType {
  ANOMALY_EVENT_TYPE_UNSPECIFIED = 0;
  ANOMALY_EVENT_TYPE_ANOMALY = 1;
  ANOMALY_EVENT_TYPE_WARNING = 2;
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_LOW = 1;
  SEVERITY_MEDIUM = 2;
  SEVERITY_HIGH = 3;
}

enum AnomalySource {
  ANOMALY_SOURCE_UNSPECIFIED = 0;
  ANOMALY_SOURCE_CONSTRAINT_CHECK = 1;
  ANOMALY_SOURCE_MODEL_ANOMALY_DETECTION = 2;
  ANOMALY_SOURCE_FORECAST = 3;
}

// ── Shared helpers ────────────────────────────────────────────────

message RequestMeta {
  string request_id = 1;
  string trace_id = 2;
  int64 sent_at_ms = 3;
}

message TimeRange {
  int64 start_time_ms = 1;
  int64 end_time_ms = 2;
}

// ── Anomaly result receiver messages ──────────────────────────────

message AnomalyResultMessage {
  AnomalyEventType event_type = 1;
  int64 event_time_ms = 2;
  repeated string sequence_ids = 3;
  repeated double values = 4;
  Severity severity = 5;
  AnomalySource source = 6;
}

message ResultAck {
  bool accepted = 1;
  string message = 2;
}

// ── Task sync messages ────────────────────────────────────────────

message SequenceMetadata {
  string sequence_id = 1;
  string sequence_name = 2;
  string unit = 3;
  string data_type = 4;
  string role = 5;
}

message SequenceRelation {
  string relation_id = 1;
  string source_sequence_id = 2;
  string target_sequence_id = 3;
  string relation_type = 4;
  int32 lag_steps = 5;
  double confidence = 6;
}

message SemanticContext {
  repeated SequenceMetadata sequences = 1;
  repeated SequenceRelation relations = 2;
  repeated string constraint_ids = 3;
  string knowledge_version = 4;
  repeated string confirmed_historical_event_ids = 5;
}

message AnomalyTaskConfig {
  string task_id = 1;
  string task_name = 2;
  repeated string sequence_ids = 3;
  repeated string methods = 4;
  string warning_rule = 5;
  int32 context_length = 6;
  int64 slide_step_ms = 7;
  int32 minimum_points = 8;
  SemanticContext semantic_context = 9;
}

message ForecastTaskConfig {
  string task_id = 1;
  string task_name = 2;
  repeated string target_sequence_ids = 3;
  repeated string feature_sequence_ids = 4;
  int64 observation_window_ms = 5;
  int32 forecast_horizon_steps = 6;
  int32 minimum_points = 7;
  string model_key = 8;
  SemanticContext semantic_context = 9;
}

message AnalysisSyncAnomalyTaskRequest {
  RequestMeta meta = 1;
  int64 config_version = 2;
  AnomalyTaskConfig task = 3;
}

message AnalysisSyncForecastTaskRequest {
  RequestMeta meta = 1;
  int64 config_version = 2;
  ForecastTaskConfig task = 3;
}

message TaskAck {
  string task_id = 1;
  bool accepted = 2;
  AnalysisStatus status = 3;
  string message = 4;
  int64 updated_at_ms = 5;
}

message AnalysisUpdateTaskStatusRequest {
  RequestMeta meta = 1;
  string task_id = 2;
  AnalysisTaskStatus status = 3;
}

// ── Query messages ────────────────────────────────────────────────

message ResultQuery {
  RequestMeta meta = 1;
  string task_id = 2;
  optional TimeRange time_range = 3;
  bool latest_only = 4;
  int32 limit = 5;
  string page_token = 6;
}

message AnomalyFinding {
  string anomaly_type = 1;
  string severity = 2;
  string description = 3;
  optional double score = 4;
  optional int64 detected_time_ms = 5;
  repeated string related_sequence_ids = 6;
}

message AnomalyResult {
  string task_id = 1;
  string run_id = 2;
  int64 generated_at_ms = 3;
  AnalysisStatus status = 4;
  string message = 5;
  repeated AnomalyFinding findings = 6;
  string model_version = 7;
}

message QueryAnomalyResultsRequest {
  ResultQuery query = 1;
}

message QueryAnomalyResultsResponse {
  string task_id = 1;
  repeated AnomalyResult results = 2;
  string next_page_token = 3;
}

message RiskFinding {
  string rule_id = 1;
  string severity = 2;
  string description = 3;
  optional int64 predicted_time_ms = 4;
  repeated string related_sequence_ids = 5;
}

message ForecastResult {
  string task_id = 1;
  string run_id = 2;
  int64 generated_at_ms = 3;
  AnalysisStatus status = 4;
  string message = 5;
  repeated int64 timestamps_ms = 6;
  repeated string sequence_ids = 7;
  repeated double values = 8;
  repeated RiskFinding risk_findings = 9;
  string model_version = 10;
}

message QueryForecastResultsRequest {
  ResultQuery query = 1;
}

message QueryForecastResultsResponse {
  string task_id = 1;
  repeated ForecastResult results = 2;
  string next_page_token = 3;
}

// ── Decision messages ─────────────────────────────────────────────

message AnalysisDecisionRequest {
  RequestMeta meta = 1;
  string event_id = 2;
  string event_type = 3;
  string event_summary = 4;
  SemanticContext semantic_context = 5;
  repeated string related_historical_event_ids = 6;
  map<string, string> statistics = 7;
}

message AnalysisDecisionResult {
  string event_id = 1;
  AnalysisStatus status = 2;
  string message = 3;
  string content = 4;
  repeated string basis_ids = 5;
}
