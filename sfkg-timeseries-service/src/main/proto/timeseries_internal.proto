syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.sfkg.timeseries.grpc";
option java_outer_classname = "TimeseriesInternalProto";

service TimeseriesCoreService {
  rpc SyncInstanceConfig (SyncInstanceConfigRequest) returns (SyncResponse);
  rpc SyncConstraintConfig (SyncConstraintConfigRequest) returns (SyncResponse);
  rpc SyncRelationConfig (SyncRelationConfigRequest) returns (SyncResponse);
  rpc SyncTimeseriesData (SyncTimeseriesDataRequest) returns (SyncResponse);
  rpc SyncTaskStatus (SyncTaskStatusRequest) returns (SyncResponse);
  rpc QueryHistoryData (QueryHistoryDataRequest) returns (QueryHistoryDataResponse);
}

service TimeseriesAnomalyService {
  rpc SyncAnomalyTask (SyncAnomalyTaskRequest) returns (SyncResponse);
  rpc UpdateAnomalyTaskStatus (SyncTaskStatusRequest) returns (SyncResponse);
  rpc QueryAnomalyResult (QueryAnomalyResultRequest) returns (QueryAnomalyResultResponse);
}

service TimeseriesForecastService {
  rpc SyncForecastTask (SyncForecastTaskRequest) returns (SyncResponse);
  rpc UpdateForecastTaskStatus (SyncTaskStatusRequest) returns (SyncResponse);
  rpc QueryForecastResult (QueryForecastResultRequest) returns (QueryForecastResultResponse);
}

service TimeseriesDecisionService {
  rpc GenerateDiagnosisResult (DecisionContextRequest) returns (DiagnosisResultResponse);
  rpc GenerateDecisionSuggestion (DecisionContextRequest) returns (DecisionSuggestionResponse);
}

service TimeseriesEventReceiverService {
  rpc ReceiveEvent (EventMessage) returns (SyncResponse);
}

message SyncResponse {
  bool success = 1;
  string message = 2;
}

message SyncInstanceConfigRequest {
  string sequence_id = 1;
  string instance_name = 2;
  string category_id = 3;
  string device_instance_id = 4;
}

message SyncConstraintConfigRequest {
  string constraint_id = 1;
  string constraint_expression = 2;
  map<string, string> variable_mapping = 3;
}

message SyncRelationConfigRequest {
  string relation_id = 1;
  repeated string source_categories = 2;
  string target_category_id = 3;
}

message TimeseriesDataPointMessage {
  string sequence_id = 1;
  string timestamp = 2;
  string value = 3;
}

message SyncTimeseriesDataRequest {
  string sequence_id = 1;
  repeated TimeseriesDataPointMessage points = 2;
}

message SyncTaskStatusRequest {
  string task_id = 1;
  string task_type = 2;
  string status = 3;
}

message SyncAnomalyTaskRequest {
  string task_id = 1;
  repeated string detect_objects = 2;
  string detect_method = 3;
}

message SyncForecastTaskRequest {
  string task_id = 1;
  repeated string forecast_objects = 2;
  string forecast_horizon = 3;
}

message QueryHistoryDataRequest {
  string sequence_id = 1;
  string start_time = 2;
  string end_time = 3;
  string granularity = 4;
}

message QueryHistoryDataResponse {
  string sequence_id = 1;
  string payload_json = 2;
}

message QueryAnomalyResultRequest {
  string task_id = 1;
  string sequence_id = 2;
}

message QueryAnomalyResultResponse {
  string payload_json = 1;
}

message QueryForecastResultRequest {
  string task_id = 1;
  string sequence_id = 2;
}

message QueryForecastResultResponse {
  string payload_json = 1;
}

message DecisionContextRequest {
  string event_id = 1;
  string context_json = 2;
}

message DiagnosisResultResponse {
  string diagnosis_result = 1;
  string diagnosis_basis = 2;
}

message DecisionSuggestionResponse {
  string suggestion = 1;
}

message EventMessage {
  string event_id = 1;
  string event_name = 2;
  string event_type = 3;
  string event_source = 4;
  repeated string related_sequences = 5;
  repeated string related_rules = 6;
  string event_description = 7;
  string event_level = 8;
  string event_time = 9;
  string confirm_status = 10;
  string handle_status = 11;
  string diagnosis_result = 12;
  string diagnosis_basis = 13;
  string disposal_result = 14;
  string create_time = 15;
  string update_time = 16;
  string create_user = 17;
  string update_user = 18;
}
