; ============================================================
; 数据写入接口 — 配置文件（用记事本打开，改完保存即可）
; 分号开头的行是注释，不会生效
; ============================================================

[gstore]
; gStore 图数据库的地址 —— 最重要的一项！
;   数据库在自己电脑上: 保持 127.0.0.1 不变
;   数据库在别的电脑/服务器上: 把 host 改成那台机器的 IP 地址
host = 127.0.0.1
port = 9999

; gStore 账号密码（默认 root / 123456）
user = root
password = 123456

; 默认库名:
;   留空  -> 每次写入时弹窗询问库名（已存在直接写入，不存在自动创建）
;   填名字 -> 启动时自动检查并创建这个库，作为默认写入库
database =

; 命名空间（一般不用改）
namespace = http://gbuilder.org/knowledge/

[service]
; 本接口对外提供服务的端口（一般不用改）
port = 8006
